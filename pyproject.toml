[project]
name = "living-adr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jonah Martinez", email = "jonamart@microsoft.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.104.1",
    "cryptography>=43.0.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langgraph>=1.2.1",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langsmith>=0.8.5",
    "llama-index>=0.14.22",
    "llama-index-core>=0.14.22",
    "mcp>=1.27.1",
    "pydantic>=2.13.4",
    "pyjwt>=2.10.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.48.0",
]

[project.scripts]
living-adr = "living_adr:main"
living-adr-mcp = "living_adr.apps.mcp_context_server.startup:main"
living-adr-workflow = "living_adr.apps.workflow_service.startup:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
