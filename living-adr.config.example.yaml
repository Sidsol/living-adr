# Copy this file to living-adr.config.yaml and edit for your deployment.
repositories:
  - repository_identity:
      # RepositoryIdentity: provider plus stable repository coordinates.
      provider: github
      owner: "<github-owner>"
      name: "<github-repo>"
    github_app:
      # GitHub App installation id authorized for this repository.
      installation_id: "<installation-id>"
    adr_publication:
      # policy enum: draft_only, pull_request, or direct_commit.
      policy: pull_request
      branch: main
      path: docs/adr
    llm:
      # false means external LLM calls are disabled for this deployment.
      external_llm_allowed: false
