slices:
  - id: 1
    name: Secret-safe onboarding diagnostics
    stories: [US-1, US-4]
    depends_on: []
    parallelizable: false
    automation: AFK
    automation_reason: Pure diagnostic model and formatter with deterministic redaction and exit semantics.
    task_ids: [TASK-001, TASK-002, TASK-003, TASK-004, TASK-005, TASK-006]
    checkpoint_criteria:
      - Blocking diagnostics produce failed result and non-zero exit code mapping.
      - Passing result reports safe metadata only.
      - Formatter groups diagnostics by category and includes remediation text.
      - Secret-like values and raw payload/diff/prompt/draft fields are redacted.
  - id: 2
    name: Config, environment, and .env.example alignment
    stories: [US-1, US-3, US-4]
    depends_on: [1]
    parallelizable: false
    automation: HITL
    automation_reason: Reuses feature 002 config semantics and defines the operator-facing setup contract.
    task_ids: [TASK-007, TASK-008, TASK-009, TASK-010]
    checkpoint_criteria:
      - Invalid config diagnostics come from feature 002 loader/error types.
      - Missing required env vars are reported using names matching .env.example.
      - .env.example contains placeholders only and no real secrets.
      - Output states config changes require restarting both deployables.
      - No file watcher, hot reload, or automatic repository discovery is introduced.
  - id: 3
    name: GitHub App installation and permission verification
    stories: [US-2, US-4]
    depends_on: [1, 2]
    parallelizable: false
    automation: HITL
    automation_reason: Validates SCM trust and permission boundary through feature 003 provider handles.
    task_ids: [TASK-011, TASK-012, TASK-013, TASK-014, TASK-015]
    checkpoint_criteria:
      - Valid installation and required permissions produce passing diagnostics.
      - Missing, wrong, or suspended installation fails with repository-scoped remediation.
      - livingadr_only requires contents:read only.
      - GitHub publication policies require contents:write.
      - GitHub API details remain inside the SCM adapter/provider seam.
      - Tests do not require live GitHub network access.
  - id: 4
    name: Operator command/startup check integration
    stories: [US-1, US-4]
    depends_on: [2, 3]
    parallelizable: false
    automation: AFK
    automation_reason: Thin wrapper over the validated service plus end-to-end command behavior.
    task_ids: [TASK-016, TASK-017, TASK-018, TASK-019]
    checkpoint_criteria:
      - Passing validation exits 0 and prints safe repository metadata and next step.
      - Blocking validation exits non-zero and prints grouped diagnostics.
      - CLI/startup wrapper contains no YAML parsing or direct GitHub API logic.
      - Output labels the check as PoC single-repo onboarding validation and excludes multi-repo automation.
