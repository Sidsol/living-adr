contracts:
  consumes:
    feature_009:
      producer: hitl-review-ui
      contract: ReviewResumeCommand from reviewer approve, approve_after_edit, reject, or defer action
      notes: Feature 009 captures reviewer intent and content hashes but does not mint authority.
    feature_007:
      producer: llamaindex-property-graph-adapter
      contract: ArchitectureGraphStore and ArchitectureContextQuery behind domain ports
      notes: Feature 010 uses graph write ports only through ApprovalBoundMutationService and never imports adapter internals.
    feature_015:
      producer: workflow-orchestration-checkpointing
      contract: WorkflowState, ReviewRequestPayload, ReviewResumeCommand, mutation handoff seam, deterministic thread id
      notes: Feature 015 checkpoint durability remains distinct from feature 010 audit durability.
  produces:
    approved_review_decision:
      description: Short-lived one-shot capability minted from human-approved review outcomes.
      fields:
        - decision_id
        - repository
        - reviewer_id
        - workflow_thread_id
        - review_event_id
        - adr_draft_id
        - adr_record_id
        - adr_draft_content_hash
        - structural_change_event_id
        - decision_version
        - decision_minted_at
        - decision_ttl
        - target_mutation_fingerprint
        - consumed_at
      default_ttl_minutes: 10
      hash_algorithm: SHA-256 over canonical UTF-8 LF rendered ADR Markdown
    approval_bound_mutation_service:
      description: Sole authoritative mutation path for graph writes and downstream publish-back consumption.
      required_for_feature_011: true
    audit_durability:
      description: Append-only approval, validation, consumption, mutation, and publication linkage audit separate from workflow checkpoints.

