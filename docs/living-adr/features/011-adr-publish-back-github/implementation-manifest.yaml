contracts:
  consumes:
    feature_010:
      producer: approval-capability-and-audit-durability
      contract: ApprovedReviewDecision via ApprovalBoundMutationService
      required_fields:
        - decision_id
        - repository
        - adr_record_id
        - adr_draft_content_hash
        - target_mutation_fingerprint
        - decision_minted_at
        - decision_ttl
      notes: Publish-back is an authoritative mutation and must pass through the approval-bound mutation boundary; decision_id is the audit join key.
    feature_003:
      producer: github-webhook-ingestion
      contract: SCMProvider and GitHubProvider with repository-scoped GitHub App credentials
      notes: Publication uses provider seams for contents/list/commit operations and must not redefine GitHub credentials or raw REST access.
    feature_002_transitive:
      producer: tracked-repository-configuration
      contract: RepositoryConfig including adr_publication_policy, target branch, and ADR path template
      notes: Target branch/path/policy are config-owned; default path is docs\adr\NNNN-<slug>.md.
  produces:
    publication_service:
      description: Approval-bound service that publishes approved ADRRecord markdown according to repository policy.
      direct_commit_default: true
      pr_publication: post_poc_extension
    publication_record:
      key_fields:
        - decision_id
        - repository
        - adr_record_id
        - content_hash
        - target_branch
        - target_path
        - commit_sha
        - status
      idempotency: Same decision_id and same fingerprint returns prior result; mismatched fingerprint is rejected.
    scm_contents_port_extensions:
      description: Provider-neutral file listing/read/write operations implemented by GitHubProvider if not already present.

slices:
  - id: S011-01
    name: publication-policy-and-target-resolution
    tasks: [T011-S1-001, T011-S1-002, T011-S1-003]
  - id: S011-02
    name: approval-bound-publication-audit-and-idempotency
    tasks: [T011-S2-001, T011-S2-002, T011-S2-003, T011-S2-004]
  - id: S011-03
