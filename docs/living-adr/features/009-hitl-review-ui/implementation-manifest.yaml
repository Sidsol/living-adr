  - feature_id: '008'
    name: claude-adr-drafting-capability
    consumes:
      - provisional ADRDraft content/hash/citations/model metadata
      - provisional-rationale label
    boundary: does not generate drafts or call Claude
  - feature_id: '015'
    name: workflow-orchestration-checkpointing
    consumes:
      - ReviewRequestPayload
      - ReviewResumeCommand
      - pending LangGraph HITL checkpoint/thread identity
