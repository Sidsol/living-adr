blocked_by: []
autopilot_assumptions:
  - local single-user UI token protects all review routes
  - signed per-review nonce protects state-changing form posts
  - reviewer id comes from PoC configuration until multi-user identity exists
  - allowed actions are approve, approve_after_edit, reject, and defer
  - edited drafts require Title, Status, Context, Decision, and Consequences sections
  - feature 010 remains responsible for ApprovedReviewDecision minting and durable audit
